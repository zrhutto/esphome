substitutions:
  name: "geeni-bulb"

esphome:
  name: ${name}
  #name_add_mac_suffix: true
  project:
    name: esphome.geeni-bulb
    version: "1.1"

bk72xx:
  board: generic-bk7231t-qfn32-tuya

dashboard_import:
  package_import_url: github://zrhutto/esphome/geeni-bulb.yaml
# Enable logging
logger:

# Enable Home Assistant API
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Geeni-Bulb Fallback Hotspot"
    password: !secret wifi_ap_password

output:
  - platform: libretiny_pwm
    pin: PWM5
    frequency: 1000 Hz
    id: pwm_output
# using light with the PWM
light:
  - platform: monochromatic
    output: pwm_output
    name: Light
